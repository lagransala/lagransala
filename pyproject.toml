[project]
name = "lagransala"
version = "0.5.2"
description = "Cartelera"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=24.1.0",
    "aiohttp>=3.11.18",
    "aiolimiter>=1.2.1",
    "beautifulsoup4>=4.13.4",
    "fastapi[standard]",
    "google-genai>=1.26.0",
    "groq>=0.30.0",
    "instructor>=1.7.9",
    "langfuse>=3.2.1",
    "litellm>=1.67.1",
    "loguru>=0.7.3",
    "markdownify>=1.1.0",
    "pydantic>=2.11.3",
    "python-dotenv>=1.0.0",
    "sqlmodel>=0.0.24",
    "tenacity>=8.0.0",
    "typer>=0.16.0",
    "uvicorn>=0.35.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
lagransala= "lagransala.__main__:app"

[dependency-groups]
dev = [
    "commitizen",
    "pre-commit",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "import-linter",
    "ruff>=0.17.1",
    "ty>=0.0.88",
]
docs = [
    "mkdocs-autolinks-plugin>=0.7.1",
    "mkdocs-git-revision-date-localized-plugin>=1.6.0",
    "mkdocs-htmlproofer-plugin>=1.6.0",
    "mkdocs-material>=9.7.7",
    "mkdocs-minify-plugin>=0.8.0",
    "mkdocs-section-index>=0.3.12",
    "mkdocstrings>=1.0.7",
    "mkdocstrings-python>=2.0.9",
    "properdocs>=1.6.7",
]

[tool.uv]
# The docs plugins still depend on mkdocs. Keep it on the 1.x line, since the
# announced v2 will not support existing plugins, themes or configuration.
constraint-dependencies = ["mkdocs<2"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "session"
addopts = "-ra --cov=src"

[tool.commitizen]
name = "cz_customize"
version_provider = "uv"
tag_format =  "v${version}"
version_scheme = "semver"
update_changelog_on_bump = true

[tool.commitizen.customize]
# Same behaviour as cz_conventional_commits (validation, version bumps), but the
# changelog also lists `build`, `ci` and `docs` commits. cz_customize leaves
# schema_pattern empty by default, so it is copied here to keep `cz check` strict.
schema_pattern = '''(?s)(build|bump|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\(\S+\))?!?: ([^\n\r]+)((\n\n.*)|(\s*))?$'''
commit_parser = '''^((?P<change_type>feat|fix|refactor|perf|build|ci|docs|BREAKING CHANGE)(?:\((?P<scope>[^()\r\n]*)\)|\()?(?P<breaking>!)?|\w+!):\s(?P<message>.*)?'''
changelog_pattern = '''^((BREAKING[\-\ ]CHANGE|\w+)(\(.+\))?!?):'''
change_type_order = ["BREAKING CHANGE", "Feat", "Fix", "Refactor", "Perf", "Build", "CI", "Docs"]

[tool.commitizen.customize.change_type_map]
feat = "Feat"
fix = "Fix"
refactor = "Refactor"
perf = "Perf"
build = "Build"
ci = "CI"
docs = "Docs"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "C4",     # flake8-comprehensions
    "PIE",    # flake8-pie
    "RUF",    # ruff-specific
    "ASYNC",  # flake8-async
    "PT",     # flake8-pytest-style
    "PTH",    # flake8-use-pathlib
    "TC",     # flake8-type-checking
]
ignore = [
    "E731",  # lambda assignment
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependencies are declared as default values
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.isort]
known-first-party = ["lagransala"]

[tool.coverage.report]
exclude_also = [
    'def __repr__',
    'raise NotImplementedError',
    'if TYPE_CHECKING:',
    'class .*\bProtocol\):',
    '@(abc\.)?abstractmethod',
]
omit = [
    "*/.local/*",
    "/usr/*",
    "/nix/store/*",
    ]

[tool.importlinter]
root_package = "lagransala"

[[tool.importlinter.contracts]]
name = "schedule layers"
type = "layers"
layers = [
  "lagransala.schedule.infrastructure",
  "lagransala.schedule.application",
  "lagransala.schedule.domain",
  "lagransala.shared"
]

[[tool.importlinter.contracts]]
name = "scraper layers"
type = "layers"
layers = [
  "lagransala.scraper.infrastructure",
  "lagransala.scraper.application",
  "lagransala.scraper.domain",
  "lagransala.shared"
]

[[tool.importlinter.contracts]]
name = "extractor layers"
type = "layers"
layers = [
  "lagransala.extractor.infrastructure",
  "lagransala.extractor.application",
  "lagransala.extractor.domain",
  "lagransala.shared"
]

[[tool.importlinter.contracts]]
name = "bounded contexts"
type = "independence"
modules = [
    "lagransala.schedule",
    "lagransala.scraper",
    "lagransala.extractor",
]

[tool.ty.terminal]
error-on-warning = true
